name: corp-portal-ui

services:
  app:
    image: corp-portal-ui:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_CONFIGURATION: ${BUILD_CONFIGURATION:-local}
    ports:
      - '${HOST_BIND_ADDRESS:-127.0.0.1}:${PORT:-8082}:8080'
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
