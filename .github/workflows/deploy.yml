# Frontend deploy (formerly the Jenkins verify/plan/deploy job).
# - push to main → deploy dev automatically
# - prod (or a dev plan) → run this workflow by hand ("Run workflow")
# AWS access is an OIDC role per environment; nothing long-lived is stored.
# Repository variables (Settings → Secrets and variables → Actions → Variables), prefixed by
# environment because GitHub Environments are not available on private repos with GitHub Free:
#   DEV_AWS_ROLE_ARN, DEV_AWS_ACCOUNT_ID, DEV_AWS_REGION, DEV_TF_STATE_BUCKET,
#   DEV_TF_STATE_REGION, DEV_API_BASE_URL  (and the same with PROD_)
# A missing value never falls back to the other environment.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, prod]
        default: dev
      action:
        description: plan previews AWS changes; deploy applies them and uploads the site
        type: choice
        options: [plan, deploy]
        default: plan

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: ${{ inputs.action || 'deploy' }} ${{ inputs.environment || 'dev' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # One run per environment at a time: Terraform's lock does not cover the S3 upload.
    concurrency:
      group: deploy-${{ inputs.environment || 'dev' }}
      cancel-in-progress: false
    env:
      TARGET: ${{ inputs.environment || 'dev' }}
      ACTION: ${{ inputs.action || 'deploy' }}
      # vars lookups are case-insensitive: 'dev_AWS_ROLE_ARN' reads DEV_AWS_ROLE_ARN.
      AWS_ROLE_ARN: ${{ vars[format('{0}_AWS_ROLE_ARN', inputs.environment || 'dev')] }}
      AWS_ACCOUNT_ID: ${{ vars[format('{0}_AWS_ACCOUNT_ID', inputs.environment || 'dev')] }}
      AWS_REGION: ${{ vars[format('{0}_AWS_REGION', inputs.environment || 'dev')] || 'ap-southeast-1' }}
      TF_STATE_BUCKET: ${{ vars[format('{0}_TF_STATE_BUCKET', inputs.environment || 'dev')] }}
      TF_STATE_REGION: ${{ vars[format('{0}_TF_STATE_REGION', inputs.environment || 'dev')] || 'ap-southeast-1' }}
      API_BASE_URL: ${{ vars[format('{0}_API_BASE_URL', inputs.environment || 'dev')] || '/api' }}
    steps:
      - name: Check AWS configuration
        id: config
        run: |
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "::notice::AWS is not configured for environment '$TARGET' (no {ENV}_AWS_ROLE_ARN variable). Nothing was deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.config.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: hashicorp/setup-terraform@v3
        if: steps.config.outputs.ready == 'true'
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.config.outputs.ready == 'true'
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Verify and build
        if: steps.config.outputs.ready == 'true'
        run: bash scripts/ci/verify.sh "$TARGET"
      - name: Terraform checks
        if: steps.config.outputs.ready == 'true'
        run: bash scripts/ci/terraform-validate.sh
      - name: ${{ env.ACTION }}
        if: steps.config.outputs.ready == 'true'
        run: bash scripts/ci/deploy.sh "$ACTION" "$TARGET"
