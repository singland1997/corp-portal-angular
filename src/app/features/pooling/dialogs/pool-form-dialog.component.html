<p-dialog
  [visible]="visible()"
  (visibleChange)="visible.set($event)"
  [header]="text.t(isEdit() ? 'edit' : 'create')"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [closeAriaLabel]="text.t('close')"
  [pt]="{ root: { class: 'w-[560px] max-w-[calc(100vw-2rem)]' } }"
>
  <form class="grid gap-5" (ngSubmit)="save()">
    @if (data.mutationError(); as apiError) {
      <p-message severity="error" role="alert">{{ i18n.t(apiError) }}</p-message>
    }

    <div class="grid gap-2">
      <label for="pool-name">
        {{ text.t('poolName') }}
        <span class="text-red-700" aria-hidden="true">*</span>
      </label>
      <input
        pInputText
        id="pool-name"
        name="poolName"
        [(ngModel)]="draft.name"
        maxlength="80"
        required
        autofocus
      />
    </div>

    <div class="grid gap-2">
      <label for="pool-corporate">
        {{ text.t('corporate') }}
        <span class="text-red-700" aria-hidden="true">*</span>
      </label>
      <p-select
        inputId="pool-corporate"
        name="corporate"
        [(ngModel)]="draft.corporate"
        [options]="corporateOptions()"
        optionLabel="label"
        optionValue="value"
        appendTo="body"
        fluid
      />
      <p class="text-xs text-muted">{{ text.t('scopeHint') }}</p>
    </div>

    <div class="grid gap-2">
      <label for="pool-status">
        {{ text.t('status') }}
        <span class="text-red-700" aria-hidden="true">*</span>
      </label>
      <p-select
        inputId="pool-status"
        name="status"
        [(ngModel)]="draft.status"
        [options]="text.statusOptions()"
        optionLabel="label"
        optionValue="value"
        appendTo="body"
        fluid
      />
    </div>

    <p class="text-sm text-muted">{{ text.t(isEdit() ? 'editWarning' : 'createHint') }}</p>

    @if (error(); as validationError) {
      <p-message severity="error" role="alert">{{ text.t(validationError) }}</p-message>
    }

    <div class="flex justify-end gap-2">
      <p-button
        [label]="text.t('cancel')"
        [ariaLabel]="text.t('cancel')"
        severity="secondary"
        [outlined]="true"
        (onClick)="visible.set(false)"
      />
      <p-button
        type="submit"
        [loading]="data.busy()"
        [disabled]="data.busy()"
        [label]="text.t(isEdit() ? 'save' : 'create')"
        [ariaLabel]="text.t(isEdit() ? 'save' : 'create')"
      />
    </div>
  </form>
</p-dialog>
