<div class="grid gap-4 md:gap-6">
  <cp-page-header [title]="i18n.t('api')" />
  <p-message severity="warn" icon="pi pi-info-circle">
    <div>
      <strong>{{ i18n.t('draft') }}</strong>
      <p class="mt-2 font-normal leading-relaxed">{{ i18n.t('docIntro') }}</p>
    </div>
  </p-message>
  <cp-card [title]="i18n.t('docEndpoints')">
    <p class="mb-4 leading-relaxed text-muted">{{ i18n.t('docEndpointsBody') }}</p>
    <div class="grid divide-y divide-line">
      @for (endpoint of endpoints; track endpoint[0] + endpoint[1]) {
        <div class="flex flex-wrap gap-3 py-3 font-mono text-sm">
          <strong class="w-16 shrink-0">{{ endpoint[0] }}</strong>
          <code class="min-w-0 break-all">{{ endpoint[1] }}</code>
        </div>
      }
    </div>
  </cp-card>
  @for (section of sections; track section.title) {
    <cp-card [title]="i18n.t(section.title)">
      <p class="max-w-4xl leading-loose text-zinc-600">{{ i18n.t(section.body) }}</p>
    </cp-card>
  }
</div>
