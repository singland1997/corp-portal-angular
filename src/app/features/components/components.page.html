<div class="grid gap-4 md:gap-6">
  <cp-page-header [title]="i18n.t('components')" />
  <cp-card [title]="i18n.t('foundations')" [subtitle]="i18n.t('foundationsHint')">
    <div class="grid grid-cols-3 gap-4 lg:grid-cols-6">
      @for (color of colors; track color.hex) {
        <div>
          <div class="mb-3 h-18 rounded-lg border border-line" [style.background]="color.hex"></div>
          <strong class="block text-xs font-medium">{{ color.name }}</strong>
          <code class="mt-1 block text-xs text-muted">{{ color.hex }}</code>
        </div>
      }
    </div>
  </cp-card>
  <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
    <cp-card [title]="i18n.t('buttons')" [subtitle]="i18n.t('buttonsHint')">
      <div class="grid gap-4 md:gap-6">
        <div class="flex flex-wrap items-center gap-2">
          <p-button
            [label]="i18n.t('primary')"
            icon="pi pi-plus"
            (onClick)="confirmOpen.set(true)"
          />
          <p-button
            [label]="i18n.t('secondary')"
            severity="secondary"
            [outlined]="true"
            (onClick)="confirmOpen.set(true)"
          />
          <p-button
            icon="pi pi-eye"
            [ariaLabel]="i18n.t('details')"
            severity="secondary"
            [text]="true"
            (onClick)="confirmOpen.set(true)"
          />
        </div>
        <form [formGroup]="form" (ngSubmit)="submit()" class="grid gap-4 md:gap-6">
          <cp-form-field
            inputId="showcase-name"
            [label]="i18n.t('name')"
            [hint]="i18n.t('nameHint')"
            [required]="true"
            [error]="submitted() && form.controls.name.invalid ? i18n.t('nameError') : ''"
          >
            <input
              pInputText
              class="w-full"
              id="showcase-name"
              formControlName="name"
              required
              aria-describedby="showcase-name-message"
              [attr.aria-invalid]="submitted() && form.controls.name.invalid"
            />
          </cp-form-field>
          <cp-form-field inputId="showcase-role" [label]="i18n.t('role')">
            <p-select
              inputId="showcase-role"
              formControlName="role"
              [options]="roleOptions()"
              optionLabel="label"
              optionValue="value"
              class="w-full"
              appendTo="body"
            />
          </cp-form-field>
          <div>
            <p-button
              type="submit"
              [label]="i18n.t('submit')"
              [ariaLabel]="i18n.t('submit')"
              icon="pi pi-check"
            />
          </div>
          @if (saved()) {
            <p class="mt-3 text-sm text-emerald-700" role="status">{{ i18n.t('saved') }}</p>
          }
        </form>
      </div>
    </cp-card>
    <div class="grid gap-4 md:gap-6">
      <cp-card [title]="i18n.t('badges')">
        <div class="flex flex-wrap items-center gap-2">
          @for (status of statuses; track status) {
            <cp-status-badge [status]="status" />
          }
        </div>
      </cp-card>
      <cp-card [title]="i18n.t('card')" [subtitle]="i18n.t('cardDescription')">
        <div>
          <p-button
            [label]="i18n.t('openConfirmation')"
            severity="secondary"
            [outlined]="true"
            (onClick)="confirmOpen.set(true)"
          />
        </div>
        @if (confirmed()) {
          <p class="mt-3 text-sm text-emerald-700" role="status">{{ i18n.t('confirmed') }}</p>
        }
      </cp-card>
    </div>
  </div>
  <cp-card [title]="i18n.t('states')">
    <div card-actions>
      <p-select
        [options]="stateOptions()"
        optionLabel="label"
        optionValue="value"
        [ngModel]="state()"
        (ngModelChange)="state.set($event)"
        [ariaLabel]="i18n.t('states')"
        appendTo="body"
      />
    </div>
    <cp-feedback-state [kind]="state()" (retry)="state.set('empty')" />
  </cp-card>
  <cp-confirm-dialog
    [(visible)]="confirmOpen"
    [title]="i18n.t('confirmTitle')"
    [message]="i18n.t('confirmMessage')"
    (confirmed)="confirmAction()"
  />
</div>
