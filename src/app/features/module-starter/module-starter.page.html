<div class="grid gap-4 md:gap-6">
  <cp-page-header [title]="i18n.t(title)" />
  <cp-card>
    <div class="grid justify-items-center gap-4 px-4 py-12 text-center">
      <span class="grid size-14 place-items-center rounded-2xl bg-brand-soft text-2xl">
        <i class="pi pi-th-large" aria-hidden="true"></i>
      </span>
      <h2 class="text-xl font-semibold">{{ i18n.t('comingTitle') }}</h2>
      <p class="max-w-lg leading-relaxed text-muted">{{ i18n.t('comingHint') }}</p>
      <div class="mt-4 flex flex-wrap justify-center gap-6">
        <!--        <a class="font-medium underline underline-offset-4" routerLink="/components">-->
        <!--          {{ i18n.t('components') }} →-->
        <!--        </a>-->
        <a class="font-medium underline underline-offset-4" routerLink="/api-docs">
          {{ i18n.t('api') }} →
        </a>
      </div>
    </div>
  </cp-card>
</div>
