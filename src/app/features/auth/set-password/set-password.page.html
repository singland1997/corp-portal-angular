<cp-auth-layout [compact]="true">
  <div class="mb-4 text-center">
    <span class="mb-3 inline-flex size-12 items-center justify-center rounded-xl bg-brand-soft">
      <i class="pi pi-key text-2xl" aria-hidden="true"></i>
    </span>
    <h1 class="text-2xl font-semibold tracking-tight">
      {{ t(done() ? 'doneTitle' : 'title') }}
    </h1>
  </div>

  <cp-card>
    @if (done()) {
      <div class="grid gap-5 text-center">
        <p class="leading-relaxed text-muted">{{ t('doneText') }}</p>
        <a
          routerLink="/login"
          class="w-full rounded-lg bg-brand px-4 py-3 font-semibold hover:bg-brand-hover"
        >
          {{ t('signIn') }}
        </a>
      </div>
    } @else {
      <form class="grid gap-4" (ngSubmit)="submit()" [attr.aria-busy]="busy()">
        <p class="text-sm leading-relaxed text-muted">{{ t('intro') }}</p>

        @if (!token) {
          <p-message severity="warn" role="alert">{{ t('missingLink') }}</p-message>
        }
        @if (error(); as message) {
          <p-message severity="error" role="alert">{{ message }}</p-message>
        }

        <cp-form-field
          inputId="setup-password"
          [label]="t('newPassword')"
          [hint]="t('rule')"
          [required]="true"
        >
          <div class="relative">
            <input
              pInputText
              id="setup-password"
              name="password"
              [type]="showPassword() ? 'text' : 'password'"
              autocomplete="new-password"
              class="w-full pr-12"
              required
              [ngModel]="password()"
              (ngModelChange)="password.set($event)"
              [readonly]="busy()"
            />
            <div class="absolute inset-y-0 right-1 flex items-center">
              <p-button
                [icon]="showPassword() ? 'pi pi-eye-slash' : 'pi pi-eye'"
                [text]="true"
                severity="secondary"
                [ariaLabel]="t(showPassword() ? 'hidePassword' : 'showPassword')"
                [pt]="{ root: { class: 'size-8', 'aria-pressed': showPassword() } }"
                (onClick)="showPassword.set(!showPassword())"
              />
            </div>
          </div>
        </cp-form-field>

        <cp-form-field inputId="setup-confirm" [label]="t('confirmPassword')" [required]="true">
          <input
            pInputText
            id="setup-confirm"
            name="confirm"
            [type]="showPassword() ? 'text' : 'password'"
            autocomplete="new-password"
            class="w-full"
            required
            [ngModel]="confirm()"
            (ngModelChange)="confirm.set($event)"
            [readonly]="busy()"
          />
        </cp-form-field>

        <p-button
          type="submit"
          [label]="t('submit')"
          [loading]="busy()"
          [disabled]="busy() || !token"
          styleClass="w-full"
        />
      </form>
    }
  </cp-card>
</cp-auth-layout>
