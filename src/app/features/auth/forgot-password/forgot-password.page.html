<cp-auth-layout>
  <cp-card>
    <div class="grid justify-items-center gap-5 text-center">
      <i class="pi pi-key rounded-xl bg-brand-soft p-4 text-2xl" aria-hidden="true"></i>
      <h1 class="text-2xl font-semibold">{{ i18n.t('forgotPassword') }}</h1>
      <p class="leading-relaxed text-muted">{{ i18n.t('passwordRecoveryHint') }}</p>
      <a
        routerLink="/login"
        queryParamsHandling="preserve"
        class="w-full rounded-lg bg-brand px-4 py-3 font-semibold hover:bg-brand-hover"
      >
        {{ i18n.t('backToSignIn') }}
      </a>
    </div>
  </cp-card>
</cp-auth-layout>
