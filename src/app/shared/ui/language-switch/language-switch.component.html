<div
  class="inline-flex h-8 shrink-0 items-center gap-1.5 rounded-lg bg-canvas px-2.5"
  role="group"
  [attr.aria-label]="i18n.t('language')"
>
  <p-button
    label="English"
    lang="en"
    severity="secondary"
    [text]="true"
    (onClick)="i18n.setLocale('en')"
    [pt]="{
      root: {
        class: 'h-8 w-11 min-w-0 border-0 bg-transparent p-0 text-ink hover:bg-transparent',
        'aria-pressed': i18n.locale() === 'en' ? 'true' : 'false',
      },
      label: {
        class:
          i18n.locale() === 'en' ? 'text-[0.6875rem] font-bold' : 'text-[0.6875rem] font-medium',
      },
    }"
  />
  <span class="text-[0.6875rem] text-muted" aria-hidden="true">/</span>
  <p-button
    label="ไทย"
    lang="th"
    severity="secondary"
    [text]="true"
    (onClick)="i18n.setLocale('th')"
    [pt]="{
      root: {
        class: 'h-8 w-[1.625rem] min-w-0 border-0 bg-transparent p-0 text-ink hover:bg-transparent',
        'aria-pressed': i18n.locale() === 'th' ? 'true' : 'false',
      },
      label: {
        class:
          i18n.locale() === 'th' ? 'font-thai text-xs font-bold' : 'font-thai text-xs font-medium',
      },
    }"
  />
</div>
